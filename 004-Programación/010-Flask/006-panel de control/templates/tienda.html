<!doctype html>
<html>
  <head>
    <style>

:root{--primary:#4f46e5;--primary-dark:#3730a3;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--surface:#fff;--background:#f4f6fb}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--background)}
body{min-height:100vh;display:flex;flex-direction:column}header,main,footer{width:min(1200px,calc(100% - 40px));margin:0 auto}header{padding:42px 0 24px}header h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.045em;color:#1e2551}main{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-content:start;gap:22px;padding:12px 0 48px}article{display:flex;flex-direction:column;gap:14px;min-width:0;background:white;padding:25px;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px #1e293b0a;transition:transform .2s,box-shadow .2s}article:hover{transform:translateY(-5px);box-shadow:0 16px 36px #1e293b1c}article h3{font-size:1.2rem;line-height:1.3;letter-spacing:-.02em;margin:0}article p{color:var(--muted);line-height:1.65;margin:0;flex:1}article button{align-self:stretch;border:0;border-radius:10px;background:var(--primary);color:white;font-weight:750;font-size:1rem;padding:13px 16px;cursor:pointer;transition:background .2s}article button:hover{background:var(--primary-dark)}article button:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.9rem;text-align:center}@media(max-width:600px){header,main,footer{width:calc(100% - 28px)}header{padding-top:26px}main{grid-template-columns:1fr;gap:14px}}

</style>
  </head>
  <body>
    <header>
      <h1>{{enviotienda}}</h1>
    </header>
    <main>
			{% for producto in enviolista %}
        <article>
          <h3>{{producto.nombre}}</h3>
          <p>{{producto.descripcion}}</p>
          <button>{{producto.precio}} €</button>
        </article>
			{% endfor %}
    </main>
    <footer>
      {{enviopiedepagina}}
    </footer>
  </body>
</html>
