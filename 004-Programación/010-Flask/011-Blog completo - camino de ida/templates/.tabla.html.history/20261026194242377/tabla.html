<!doctype html>
<html lang="es">
  <head>
    <title>Crear un nuevo artículo</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/admin.css">
  </head>
  <body>
    <main>
      <nav>
        <a href="/nuevo">Nuevo articulo</a>
        <a href="/listado">Listado de artículos</a>
      </nav>
      <section>
        <h3>Nuevo artículo</h3>
        <table>
          <thead>
            <tr>
              <th>Titulo</th>
              <th>Fecha</th>
              <th>Contenido</th>
            </tr>
          </thead>
          <tbody>
            {% for articulo in articulos %}
            	<tr>
                <td>{{articulo.titulo}}</td>
                <td>{{articulo.fecha}}</td>
                <td>{{articulo.contenido}}</td>
            	</tr>
            {% endfor %}
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
