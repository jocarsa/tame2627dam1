<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial de cliente · SPORTLAB</title><link rel="stylesheet" href="{{ url_for('static',filename='admin.css') }}"></head><body><div class="standalone"><a href="{{ url_for('admin',vista='clientes') }}">← Volver a clientes</a><h1>Historial de cliente</h1><p>{{ email }}</p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Nombre</th><th>Dirección</th><th>Fecha</th><th>Importe</th><th>Estado</th></tr></thead><tbody>{% for p in pedidos %}<tr><td>#{{ p.id }}</td><td>{{ p.cliente_nombre }}</td><td>{{ p.cliente_direccion }}</td><td>{{ p.creado_en }}</td><td>{{ '%.2f'|format(p.total or 0) }} €</td><td>{{ p.estado }}</td></tr>{% endfor %}</tbody></table></div></section></div></body></html>
