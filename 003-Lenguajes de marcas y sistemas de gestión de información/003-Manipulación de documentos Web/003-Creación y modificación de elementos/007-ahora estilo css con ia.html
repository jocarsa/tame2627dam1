
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El blog de Jose Vicente | JOCARSA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #26344b;
    }

    header {
      background: #192b45;
      color: white;
      padding: 28px 8%;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    header p {
      margin: 8px 0 0;
      color: #b9c9dd;
      font-size: 14px;
    }

    .presentacion {
      background: #25466c;
      color: white;
      padding: 55px 8%;
    }

    .presentacion h2 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    .presentacion p {
      color: #d1e1f3;
      line-height: 1.7;
      margin: 0;
    }

    .contenedor {
      max-width: 1200px;
      margin: auto;
      padding: 45px 25px;
    }

    .cabecera-articulos {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .cabecera-articulos h2 {
      margin: 0;
      font-size: 24px;
    }

    #contador {
      color: #748399;
      font-size: 14px;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    article {
      background: white;
      padding: 28px;
      border-radius: 12px;
      border: 1px solid #e5eaf1;
      box-shadow: 0 4px 15px rgba(20,40,70,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    article:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(20,40,70,0.12);
    }

    article time {
      color: #3274bb;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    article h3 {
      font-size: 21px;
      line-height: 1.4;
      margin: 14px 0;
    }

    article p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.8;
      flex-grow: 1;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .separador {
      width: 40px;
      height: 3px;
      background: #3274bb;
      margin-top: 20px;
      border-radius: 4px;
    }

    footer {
      background: #192b45;
      color: #b9c9dd;
      text-align: center;
      padding: 35px;
      margin-top: 50px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      main {
        grid-template-columns: 1fr;
      }

      .presentacion {
        padding: 35px 25px;
      }

      .presentacion h2 {
        font-size: 25px;
      }

      header {
        padding: 25px;
      }

      .contenedor {
        padding: 30px 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JOCARSA.</h1>
    <p>El blog de Jose Vicente</p>
  </header>

  <section class="presentacion">
    <h2>Explorando el futuro de la tecnología</h2>
    <p>
      Programación, inteligencia artificial,
      desarrollo de software y mucho más.
    </p>
  </section>

  <div class="contenedor">

    <div class="cabecera-articulos">
      <h2>Últimas publicaciones</h2>
      <span id="contador"></span>
    </div>

    <main>
      <!-- Aquí van los artículos del blog -->
    </main>

  </div>

  <footer>
    &copy; 2026 Jose Vicente · JOCARSA
  </footer>

  <script>
    fetch("blog.json")
      .then(function(resultado) {
        if (!resultado.ok) {
          throw new Error("No se pudo cargar blog.json");
        }
        return resultado.json();
      })
      .then(function(datos) {

        console.log(datos);

        let principal = document.querySelector("main");
        let contador = document.querySelector("#contador");

        // Ordenamos las noticias por fecha
        datos.sort(function(a, b) {
          return b.fecha.localeCompare(a.fecha);
        });

        // Mostramos el número de artículos
        contador.textContent = datos.length + " artículos";

        // Por cada noticia
        datos.forEach(function(dato) {

          // Creamos el artículo
          let articulo = document.createElement("article");

          let fecha = document.createElement("time");
          fecha.textContent = dato.fecha;
          fecha.dateTime = dato.fecha;

          let titulo = document.createElement("h3");
          titulo.textContent = dato.titulo;

          let contenido = document.createElement("p");
          contenido.textContent = dato.contenido;

          let separador = document.createElement("div");
          separador.className = "separador";

          // Añadimos los elementos al artículo
          articulo.appendChild(fecha);
          articulo.appendChild(titulo);
          articulo.appendChild(contenido);
          articulo.appendChild(separador);

          // Añadimos el artículo al blog
          principal.appendChild(articulo);

        });

      })
      .catch(function(error) {
        console.error(error);
        document.querySelector("main").textContent =
          "No se pudieron cargar los artículos.";
      });
  </script>

</body>
</html>
