<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      // Declaramos variables
      let base_imponible = prompt("Intruce la base:");
      let iva = prompt("Introduce el porcentaje de impuesto (por ejemplo: 21):")
      // Realizamos cálculos
      let base = base_imponible * 1 // Me aseguro entero
      let total_iva = base_imponible * (iva/100)
      let total = base + total_iva
      
      document.write("Base imponible: ",base)
      document.write("<br>")
      document.write("total IVA: ",total_iva)
      document.write("<br>")
      document.write("total factura: ",total)
      document.write("<hr>")
    </script>
  </body>
</html>
