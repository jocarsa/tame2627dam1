<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración · Tienda JV</title><link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"></head><body class="admin-page"><header class="topbar"><a class="brand" href="{{ url_for('inicio') }}"><span class="brand-icon">J</span> TIENDA <strong>JV</strong></a><nav><span class="admin-badge">PANEL DE GESTIÓN</span><a class="btn btn-outline" href="{{ url_for('inicio') }}">← Ver tienda</a></nav></header><main class="admin-main"><div class="admin-intro"><span class="eyebrow">ADMINISTRACIÓN / PRODUCTOS</span><h1>Nuevo producto<span class="accent">.</span></h1><p>Completa los datos para publicar un nuevo artículo en el catálogo.</p></div><div class="form-card"><div class="form-card-head"><span class="step">01</span><div><h2>Información del producto</h2><p>Los campos marcados con * son obligatorios.</p></div></div><form method="post" action="{{ url_for('insertar') }}"><div class="field"><label for="nombre">Nombre del producto <span>*</span></label><input id="nombre" name="nombre" type="text" maxlength="100" placeholder="Ej. Zapatillas deportivas" required autofocus></div><div class="field"><label for="descripcion">Descripción <span>*</span></label><textarea id="descripcion" name="descripcion" rows="5" placeholder="Describe las características del producto..." required></textarea></div><div class="field"><label for="precio">Precio de venta <span>*</span></label><div class="input-price"><input id="precio" name="precio" type="number" step="0.01" min="0" max="9999.99" placeholder="0.00" required><span>EUR €</span></div></div><div class="form-actions"><a class="btn btn-quiet" href="{{ url_for('inicio') }}">Cancelar</a><button class="btn btn-primary" type="submit">Publicar producto <span>→</span></button></div></form></div><p class="admin-foot">© 2026 José Vicente Carratalá · Gestión de catálogo</p></main></body></html>
