<!doctype html>
<html lang="es">
  <head>
    <title>El periódico de Jose Vicente</title>
    <meta charset="utf-8">
  </head>
  <body>
    <header>
      <h1>El periódico de Jose Vicente</h1>
      <h2>Noticias de actualidad</h2>
    </header>
    <main>
      {% for noticia in noticias %}
      <article>
        <h3>{{noticia.titulo}}</h3>
        <time>{{noticia.fecha}}</time>
        <p>{{noticia.autor}}</p>
        <p>{{noticia.texto}}</p>
      </article>
      {% endfor %}
    </main>
    <footer>
      (c) 2026 Jose Vicente Carratala
    </footer>
  </body>
</html>
